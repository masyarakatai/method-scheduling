# The fuzz and property tests at a hundred times their usual rounds, with a new seed each
# run (decision 172): the file reader, the script readers and merge. Weekly and on demand;
# ci.yml runs the usual rounds on every push. A failure names its case; run it again
# with the same METHOD_SCHEDULE_FUZZ_SEED and METHOD_SCHEDULE_FUZZ_ROUNDS. Least
# privilege; actions pinned to full commit SHAs.
name: fuzz
on:
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      METHOD_SCHEDULE_FUZZ_ROUNDS: "100"
      METHOD_SCHEDULE_FUZZ_SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fuzz and property tests
        run: |
          echo "seed $METHOD_SCHEDULE_FUZZ_SEED, rounds x$METHOD_SCHEDULE_FUZZ_ROUNDS"
          cargo test --release --locked -p method-schedule-core -p method-schedule-format
